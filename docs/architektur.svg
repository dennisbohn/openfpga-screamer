<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1560 860" width="1560" height="860" role="img" aria-label="Architektur: Die CPU wählt und sortiert die Bauteile der Strecke und schreibt je Bauteil seine Lage in Register der Geometrie-Einheit. Die liest das Mesh aus dem SDRAM, rechnet die Eckpunkte in Kamerasicht um, lässt Rückseiten weg und gibt die Flächen an Clipper und Setup-Einheit, die schneiden, projizieren und die Dreiecke für den Rasterizer vorbereiten. Der Rasterizer liest Texturen über einen Cache aus dem SDRAM, der fehlende Zeilen schon vor einer Warteschlange anfordert, und schreibt in den hinteren der beiden Framebuffer im Block-RAM; video_out zeigt den vorderen mit 50 Hz, getauscht wird in der Austastlücke. Programm und Strecke lädt der Pocket auf Anforderung über die APF-Bridge in den SDRAM.">
  <title>Screamer auf dem Analogue Pocket – Architektur</title>
  <desc>Gebaut und auf dem Pocket getestet: APF-Bridge mit Data-Slots (Programm und Strecke auf Anforderung), zwei Framebuffer im Block-RAM mit Tausch bei VSync, video_out mit 50 Hz und zwei Paletten, VexRiscv RV32IMF mit FPU und CFU, SDRAM-Controller, Rasterizer mit 16-KB-Textur-Cache, der fehlende Zeilen vorauslädt, Setup-Einheit mit Clipper. Seit Schritt 4 auch die Geometrie-Einheit, dazu ein Blitter, der das Hintergrundbild vor und die Rennanzeige nach der Szene in den Framebuffer kopiert; die CPU fährt neun Gegner (Test steht aus); mit ihr hält der Streckendurchflug stabil 50 fps, die CPU braucht davon etwa 20 % eines Bildes. Geplant: Audio, Glas und Schatten (MAPn.SMG) im Rasterizer, Sounds im SDRAM, Überlappen von Bild N+1 und N. SRAM und PSRAM sind nicht benutzt.</desc>
