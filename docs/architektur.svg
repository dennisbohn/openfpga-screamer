  <!-- notes -->
  <text x="40" y="798" class="l">Pro Bild: Die CPU wählt die Bauteile in Reichweite, sortiert sie von hinten nach vorn (Maler-Algorithmus) und schreibt sie in den Puffer der Geometrie-Einheit (113 Bauteile); dahinter arbeiten Geometrie, Setup und Rasterizer gleichzeitig.</text>
  <text x="40" y="816" class="l">Gezeigt wird nur ein fertiges Bild (Doppelpufferung, Tausch in der Austastlücke, höchstens 50 Bilder pro Sekunde). Geplant: Berührung zwischen Autos, Radar, Glas/Schatten, Audio, Bild N+1 und N überlappen.</text>
  <text x="40" y="834" class="l">Start mit allen zehn Autos: 50 fps (schwerstes Bild 67 % eines Bildes). Belegung: 15.292 von 18.480 ALMs (83 %), 253 von 308 M10K (82 %), 35 von 66 DSP (53 %); Timing hält bei 74,25 MHz.</text>
