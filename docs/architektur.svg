<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 840" width="1440" height="840" role="img" aria-label="Geplante Architektur: Der RISC-V-Prozessor arbeitet an Bild N+1 und schreibt dessen sortierte Objektliste ins SRAM, während die Geometrie-Einheit die Liste von Bild N liest und Dreiecke an den Rasterizer gibt. Der Rasterizer liest Texturen aus PSRAM cram0 und schreibt Pixel in den hinteren der beiden Framebuffer im Block-RAM; video_out zeigt den vorderen, Bild N−1, getauscht wird bei VSync. Code, Daten und Meshes liegen im SDRAM, die Dateien kommen von der SD-Karte über die APF-Bridge.">
  <title>Screamer auf dem Analogue Pocket – geplante Architektur</title>
  <desc>Gebaut und auf dem Pocket getestet: APF-Bridge mit Data-Slots, zwei Framebuffer im Block-RAM mit Tausch bei VSync, video_out mit zwei Paletten. Geplant: VexRiscv RV32IMF, SRAM-Controller mit doppelt gepufferten Befehlslisten, Geometrie-Einheit, Rasterizer, Audio, SDRAM-Controller, Textur-Speicher in cram0. PSRAM cram1 ist frei.</desc>
  <defs>
    <marker id="built" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2e7d32"/>
    </marker>
    <marker id="plan" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555555"/>
    </marker>
    <marker id="ext" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#888888"/>
    </marker>
  </defs>
  <style>
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; fill: #1f1f1f; }
    .h { font-size: 20px; font-weight: 700; }
    .t { font-size: 13px; font-weight: 600; }
    .b { font-size: 11.5px; }
    .p { font-size: 11px; font-style: italic; fill: #444444; }
    .l { font-size: 11px; fill: #444444; }
    .c { text-anchor: middle; }
    .r { text-anchor: end; }
    .built { fill: #e8f5e9; stroke: #2e7d32; stroke-width: 1.6; }
    .fresh { fill: #f3faf3; stroke: #2e7d32; stroke-width: 1.6; stroke-dasharray: 6 4; }
    .plan { fill: #ffffff; stroke: #555555; stroke-width: 1.4; stroke-dasharray: 6 4; }
    .ext { fill: #eeeeee; stroke: #999999; stroke-width: 1.2; }
    .free { fill: #ffffff; stroke: #aaaaaa; stroke-width: 1.2; stroke-dasharray: 3 3; }
    .wb { fill: none; stroke: #2e7d32; stroke-width: 1.8; }
    .wp { fill: none; stroke: #555555; stroke-width: 1.4; stroke-dasharray: 6 4; }
    .we { fill: none; stroke: #888888; stroke-width: 1.4; }
  </style>

  <rect width="1440" height="840" fill="#ffffff"/>

  <!-- title and legend -->
  <text x="40" y="44" class="h">Screamer auf dem Analogue Pocket – geplante Architektur</text>
  <text x="40" y="66" class="l">Datenfluss beim Laden und pro Bild · Stand 25.10.2026</text>

  <rect x="1100" y="22" width="22" height="13" rx="3" class="built"/>
  <text x="1130" y="33" class="l">gebaut, auf dem Pocket getestet</text>
  <rect x="1100" y="40" width="22" height="13" rx="3" class="plan"/>
  <text x="1130" y="51" class="l">geplant</text>
  <rect x="1100" y="58" width="22" height="13" rx="3" class="ext"/>
  <text x="1130" y="69" class="l">Bauteil des Pocket</text>

  <!-- SRAM above the FPGA -->
  <rect x="590" y="94" width="170" height="52" rx="6" class="ext"/>
  <text x="675" y="115" class="t c">SRAM · 256 KB</text>
  <text x="675" y="133" class="b c">Befehlslisten ×2</text>

  <!-- outside the FPGA, left -->
  <rect x="40" y="200" width="70" height="40" rx="6" class="ext"/>
  <text x="75" y="225" class="b c">SD-Karte</text>
  <rect x="120" y="200" width="70" height="40" rx="6" class="ext"/>
  <text x="155" y="225" class="b c">Tasten</text>
  <path d="M75,240 V268" class="we" marker-end="url(#ext)"/>
  <path d="M155,240 V268" class="we" marker-end="url(#ext)"/>

  <rect x="40" y="270" width="150" height="56" rx="6" class="ext"/>
  <text x="115" y="294" class="t c">Pocket-Controller</text>
  <text x="115" y="311" class="b c">(APF)</text>

  <rect x="40" y="415" width="150" height="40" rx="6" class="ext"/>
  <text x="115" y="440" class="b c">Audio-DAC</text>

  <!-- outside the FPGA, right -->
  <rect x="1270" y="282" width="140" height="56" rx="6" class="ext"/>
  <text x="1340" y="306" class="t c">Scaler-FPGA</text>
  <text x="1340" y="323" class="b c">+ Display</text>

  <!-- the FPGA -->
  <rect x="230" y="170" width="1000" height="480" rx="14" fill="#fbfbfb" stroke="#333333" stroke-width="1.5"/>
  <text x="248" y="194" class="t">Haupt-FPGA · Cyclone V 5CEBA4</text>
  <text x="1212" y="194" class="l r">Takte: Bridge 74,25 MHz · System ~100 MHz (offen) · Pixel 12,288 MHz</text>

  <rect x="600" y="206" width="150" height="30" rx="6" class="plan"/>
  <text x="675" y="226" class="t c">SRAM-Controller</text>

  <!-- row A: bridge, CPU, geometry, raster, video -->
  <rect x="250" y="260" width="130" height="100" rx="8" class="built"/>
  <text x="315" y="290" class="t c">APF-Bridge</text>
  <text x="315" y="310" class="b c">Data-Slots,</text>
  <text x="315" y="326" class="b c">Tasten, Befehle</text>

  <rect x="460" y="260" width="180" height="100" rx="8" class="plan"/>
  <text x="550" y="288" class="t c">VexRiscv RV32IMF</text>
  <text x="550" y="306" class="b c">I-/D-Cache · FPU · CFU</text>
  <text x="550" y="322" class="b c">Spiellogik, Physik, KI</text>
  <text x="550" y="344" class="p c">arbeitet an Bild N+1</text>

  <rect x="700" y="260" width="150" height="100" rx="8" class="plan"/>
  <text x="775" y="288" class="t c">Geometrie-Einheit</text>
  <text x="775" y="306" class="b c">Transformieren,</text>
  <text x="775" y="322" class="b c">Projizieren, Clipping</text>
  <text x="775" y="344" class="p c">zeichnet Bild N</text>

  <rect x="910" y="260" width="150" height="100" rx="8" class="plan"/>
  <text x="985" y="288" class="t c">Rasterizer</text>
  <text x="985" y="306" class="b c">Spans, Texturen,</text>
  <text x="985" y="322" class="b c">Schattierung</text>
  <text x="985" y="344" class="p c">zeichnet Bild N</text>

  <rect x="1100" y="260" width="110" height="100" rx="8" class="built"/>
  <text x="1155" y="288" class="t c">video_out</text>
  <text x="1155" y="306" class="b c">Palette ×2,</text>
  <text x="1155" y="322" class="b c">Timing</text>
  <text x="1155" y="344" class="p c">zeigt Bild N−1</text>

  <!-- row B: audio, framebuffers -->
  <rect x="460" y="400" width="110" height="70" rx="8" class="plan"/>
  <text x="515" y="424" class="t c">Audio</text>
  <text x="515" y="442" class="b c">JTOPL (OPL2)</text>
  <text x="515" y="458" class="b c">PCM-Mixer</text>

  <rect x="1075" y="400" width="135" height="70" rx="8" class="built"/>
  <text x="1142" y="424" class="t c">Framebuffer ×2</text>
  <text x="1142" y="442" class="b c">Block-RAM</text>
  <text x="1142" y="458" class="b c">Tausch bei VSync</text>

  <!-- row C: memory controllers -->
  <rect x="460" y="540" width="390" height="70" rx="8" class="plan"/>
  <text x="655" y="569" class="t c">SDRAM-Controller</text>
  <text x="655" y="589" class="b c">Bursts für Cache-Zeilen · zweiter Port für die Bridge</text>

  <rect x="910" y="540" width="150" height="70" rx="8" class="plan"/>
  <text x="985" y="564" class="t c">Textur-Speicher</text>
  <text x="985" y="582" class="b c">cram0, Burst-Modus</text>
  <text x="985" y="597" class="b c">+ Textur-Cache</text>

  <!-- external memory chips below -->
  <rect x="540" y="700" width="230" height="56" rx="6" class="ext"/>
  <text x="655" y="724" class="t c">SDRAM · 64 MB</text>
  <text x="655" y="741" class="b c">Code, Daten, Meshes, Sounds</text>

  <rect x="900" y="700" width="170" height="56" rx="6" class="ext"/>
  <text x="985" y="724" class="t c">PSRAM cram0 · 16 MB</text>
  <text x="985" y="741" class="b c">Texturen</text>

  <rect x="1085" y="700" width="140" height="56" rx="6" class="free"/>
  <text x="1155" y="724" class="t c" fill="#666666">PSRAM cram1 · 16 MB</text>
  <text x="1155" y="741" class="b c">frei</text>

  <!-- built connections -->
  <path d="M190,298 H248" class="wb" marker-end="url(#built)"/>
  <text x="220" y="277" class="l c">max.</text>
  <text x="220" y="290" class="l c">3,4 MB/s</text>

  <path d="M1170,398 V362" class="wb" marker-end="url(#built)"/>
  <text x="1177" y="386" class="l">vorn</text>

  <path d="M1210,310 H1268" class="wb" marker-end="url(#built)"/>
  <text x="1240" y="302" class="l c">320×200</text>
  <text x="1240" y="324" class="l c">60 Hz</text>

  <!-- planned connections -->
  <path d="M675,148 V204" class="wp" marker-start="url(#plan)" marker-end="url(#plan)"/>
  <text x="684" y="160" class="l">16 Bit</text>

  <path d="M620,258 V238" class="wp" marker-end="url(#plan)"/>
  <text x="613" y="252" class="l r">schreibt Liste N+1</text>

  <path d="M730,238 V258" class="wp" marker-end="url(#plan)"/>
  <text x="738" y="252" class="l">liest Liste N</text>

  <path d="M382,302 H458" class="wp" marker-start="url(#plan)" marker-end="url(#plan)"/>
  <text x="420" y="280" class="l c">Tasten,</text>
  <text x="420" y="293" class="l c">Lade-Befehle</text>

  <path d="M850,310 H908" class="wp" marker-end="url(#plan)"/>
  <text x="880" y="301" class="l c">Dreiecke</text>

  <path d="M1060,340 H1085 V398" class="wp" marker-end="url(#plan)"/>
  <text x="1078" y="384" class="l r">Pixel</text>
  <text x="1070" y="397" class="l r">1 pro Takt</text>

  <path d="M515,362 V398" class="wp" marker-end="url(#plan)"/>
  <text x="522" y="386" class="l">Register</text>

  <path d="M350,362 V575 H458" class="wp" marker-end="url(#plan)"/>
  <text x="342" y="500" class="l r">Firmware,</text>
  <text x="342" y="514" class="l r">Spieldaten</text>

  <path d="M460,435 H358 A8,8 0 0 0 342,435 H192" class="wp" marker-end="url(#plan)"/>
  <text x="270" y="427" class="l c">I²S</text>

  <path d="M610,362 V538" class="wp" marker-start="url(#plan)" marker-end="url(#plan)"/>
  <text x="617" y="490" class="l">Code, Daten</text>
  <text x="617" y="504" class="l">(Cache-Zeilen)</text>

  <path d="M775,540 V362" class="wp" marker-end="url(#plan)"/>
  <text x="782" y="490" class="l">Meshes</text>

  <path d="M985,540 V362" class="wp" marker-end="url(#plan)"/>
  <text x="992" y="490" class="l">Texel</text>

  <path d="M655,612 V698" class="wp" marker-start="url(#plan)" marker-end="url(#plan)"/>
  <text x="662" y="676" class="l">16 Bit</text>

  <path d="M985,612 V698" class="wp" marker-start="url(#plan)" marker-end="url(#plan)"/>
  <text x="992" y="676" class="l">16 Bit</text>

  <!-- notes -->
  <text x="40" y="798" class="l">Bild N+1, N und N−1: CPU, Grafik und Anzeige arbeiten gleichzeitig an drei aufeinanderfolgenden Bildern; Befehlslisten und Framebuffer sind doppelt gepuffert.</text>
  <text x="40" y="816" class="l">Heute füllen zwei Data-Slots die beiden Framebuffer, Taste A tauscht sie; später zeichnet der Rasterizer. Logik heute: 482 von 18.480 ALMs (3 %), Block-RAM 132 von 308 M10K.</text>
</svg>
