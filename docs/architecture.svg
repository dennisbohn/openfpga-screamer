        --ink: #f0efec; --ink2: #c3c2b7; --muted: #898781; --base: #383835;
        --built-fill: #1d3322; --built-line: #43a047;
      }
    }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; fill: var(--ink); }
    .h { font-size: 20px; font-weight: 700; }
    .t { font-size: 13px; font-weight: 600; }
    .b { font-size: 11.5px; }
    .p { font-size: 11px; font-style: italic; fill: var(--ink2); }
    .l { font-size: 11px; fill: var(--ink2); }
    .c { text-anchor: middle; }
    .r { text-anchor: end; }
    .dim { fill: var(--muted); }
    .built { fill: var(--built-fill); stroke: var(--built-line); stroke-width: 1.6; }
    .ext { fill: var(--lane); stroke: var(--muted); stroke-width: 1.2; }
    .free { fill: var(--surface); stroke: var(--base); stroke-width: 1.2; stroke-dasharray: 3 3; }
