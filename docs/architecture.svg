    .wb { fill: none; stroke: var(--built-line); stroke-width: 1.8; }
    .wf { fill: none; stroke: var(--built-line); stroke-width: 1.8; stroke-dasharray: 6 4; }
    .we { fill: none; stroke: var(--muted); stroke-width: 1.4; }
    .mk-built { fill: var(--built-line); }
    .mk-ext { fill: var(--muted); }
  </style>

