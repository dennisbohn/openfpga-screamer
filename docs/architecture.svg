<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1560 860" width="1560" height="860" role="img" aria-label="Architecture: the CPU selects and sorts the track pieces and writes each piece's position into registers of the geometry unit. The unit reads the mesh from SDRAM, transforms the vertices into camera space, drops back faces and passes the faces to the clipper and setup unit, which clip, project and prepare the triangles for the rasterizer. The rasterizer reads textures from SDRAM through a cache that requests missing lines ahead of time and writes into the back one of the two framebuffers in block RAM; video_out shows the front one at 50 Hz, and the two swap during blanking. The Pocket loads the program and the track into SDRAM on request through the APF bridge. The mixer plays the sound effects and the speaker from SDRAM, 32 voices, plus the CD music from a ring in SDRAM that the firmware fills from the CD image on the SD card, or without that image the FM music of an OPL2 chip that the firmware feeds with time-stamped register writes, and sends everything as I2S to the Pocket.">
  <title>Screamer on the Analogue Pocket – architecture</title>
  <desc>Built and tested on the Pocket: APF bridge with data slots (program and original game files on request), two framebuffers in block RAM that swap at VSync, video_out at 50 Hz with two palettes, VexRiscv RV32IMF with FPU and CFU, SDRAM controller, rasterizer with a 16 KB texture cache that prefetches missing lines, setup unit with clipper, the geometry unit, and a blitter that copies the backdrop image in before and the race display in after the scene. The CPU drives nine opponents with collisions and splits movable track parts (the helmet at the start) into their blocks; with it the track fly-through holds a steady 50 fps, and the CPU needs about 20 % of a frame. The rasterizer also draws smoke and shadows (MAPn.SMG), obstacles and moving scenery. The mixer plays the sound effects and the speaker (32 voices from SDRAM, one line per voice in block RAM, I2S to the Pocket) and the CD music (16-bit stereo from GOG's CD image, linearly interpolated from 44.1 to 48 kHz) or, without the image, the game's MIDI songs on an OPL2 FM chip (JTOPL, a queue of time-stamped register writes, linearly interpolated from 49.7 to 48 kHz). SRAM and PSRAM are not used.</desc>
